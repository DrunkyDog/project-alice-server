# If you only want a lightweight installation of xiaozhi-server and only use the local configuration file, you don't need to bother with this file or modify anything in it.
# If you want to get configuration from manager-api, please read on:
# Copy this file to the xiaozhi-server/data directory. If the data directory doesn't exist, create one and rename the copied file to .config.yaml
# Note: If the data directory already has a .config.yaml file, delete it first
# First start manager-api and manager-web, register an account. The first registered account will be the administrator
# As an administrator, go to the [Parameter Management] page, find [server.secret], and copy its value. Note that server.secret changes with every fresh deployment
# Open the .config.yaml file in the data directory and modify manager-api.secret to the server.secret value you just copied
server:
  ip: 0.0.0.0
  port: 8000
  # HTTP service port for the vision analysis interface
  http_port: 8003
  # Vision analysis interface address
  # The vision analysis interface address sent to the device
  # If you use the default configuration below, the system will automatically generate the vision recognition address and output it in the startup logs. You can verify this address by visiting it directly in your browser
  # When using Docker deployment or public network deployment (with SSL/domain name), this may not be accurate
  # Therefore, when using Docker deployment, set vision_explain to a local area network address
  # When using public network deployment, set vision_explain to a public network address
  vision_explain: http://your_ip_or_domain:port/mcp/vision/explain
manager-api:
  # Your manager-api address, preferably using a local area network IP
  # If using Docker deployment, set this to http://xiaozhi-esp32-server-web:8002/xiaozhi
  url: http://xiaozhi-esp32-server-web:8002/xiaozhi
  # Your manager-api token, which is the server.secret value you just copied
  secret: 69429529-9d23-4464-9512-6469b16b15f7
# Default system prompt template file
prompt_template: agent-base-prompt.txt
