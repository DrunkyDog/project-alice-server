  DoubaoTTS:
    # Define TTS API type
    type: doubao
    # Volcengine TTS service, requires creating an application in the Volcengine console and obtaining appid and access_token
    # Volcengine TTS must be purchased, starting at 30 CNY, giving 100 concurrent connections. The free tier only has 2 concurrent connections, which frequently causes TTS errors
    # After purchasing the service and buying free voices, you may need to wait about half an hour before using them
