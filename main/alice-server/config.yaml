# During development, please create a data directory in the project root, then create an empty file named [.config.yaml] inside the data directory
# Then, to modify any configuration, edit the [.config.yaml] file instead of the [config.yaml] file
# The system will first read the configuration from [data/.config.yaml]; if a configuration item does not exist in [.config.yaml], the system will automatically read from [config.yaml]
# This allows minimal configuration and protects your key security.
# If you are using the Smart Console, all configurations below will not take effect. Please modify configurations in the Smart Console instead.

# #####################################################################################
# ############################# Server Basic Runtime Configuration ####################
server:
  # Server listening address and port
  ip: 0.0.0.0
  port: 8000
  # HTTP service port, used for simple OTA interface (single service deployment) and vision analysis interface
  http_port: 8003
  # This websocket configuration refers to the websocket address that the OTA interface sends to the device
  # If using the default writing, the OTA interface will automatically generate a websocket address and output it in the startup log. You can verify this address by accessing the OTA interface via browser
  # When deploying with Docker or public network (using SSL/domain), it may not be accurate
  # So if you deploy with Docker, set websocket to a LAN address
  # If you deploy on a public network, set websocket to a public network address
  websocket: ws://your_ip_or_domain:port/xiaozhi/v1/
  # Vision analysis interface address
  # Interface address for sending vision analysis to the device
  # If using the default writing below, the system will automatically generate a vision recognition address and output it in the startup log. You can verify this address by accessing it via browser
  # When deploying with Docker or public network (using SSL/domain), it may not be accurate
  # So if you deploy with Docker, set vision_explain to a LAN address
  # If you deploy on a public network, set vision_explain to a public network address
  vision_explain: http://your_ip_or_domain:port/mcp/vision/explain
  # OTA return information timezone offset
  timezone_offset: +7
  # Authentication configuration
  auth:
    # Whether to enable authentication
    enabled: false
    # Whitelist device ID list
    # Devices in the whitelist will be allowed without token verification
    allowed_devices:
      - "54:b2:03:9b:a0:bc"
  # MQTT gateway configuration, used for OTA delivery to devices, configured according to mqtt_gateway's .env file, format: host:port
  mqtt_gateway: null
  # MQTT signature key, used to generate MQTT connection password, configured according to mqtt_gateway's .env file
  mqtt_signature_key: null
  # UDP gateway configuration
  udp_gateway: null
log:
  # Set the log format for console output: time, log level, tag, message
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # Set the log format for file output: time, log level, tag, message
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Set log level: INFO, DEBUG
  log_level: INFO
  # Set log directory
  log_dir: tmp
  # Set log file
  log_file: "server.log"
  # Set data file path
  data_dir: data

# Delete the sound file when you are done using it
delete_audio: true
# How long without voice input before disconnecting (seconds), default 2 minutes (120 seconds)
close_connection_no_voice_time: 120
# TTS request timeout (seconds)
tts_timeout: 10
# Tool call timeout (seconds)
tool_call_timeout: 30
# Enable wake word response cache
enable_wakeup_words_response_cache: true
# Whether to respond to wake word at opening
enable_greeting: true
# Whether to enable notification sound after speaking
enable_stop_tts_notify: false
# Notification sound effect address after speaking
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Whether to enable WebSocket heartbeat keep-alive mechanism
enable_websocket_ping: false

# TTS audio send delay configuration
# tts_audio_send_delay: controls the interval between audio packet sending
#   0: Use precise time control, strictly matching audio frame rate (default, calculated at runtime based on audio frame rate)
#   > 0: Use a fixed delay (milliseconds) for sending, e.g.: 60
tts_audio_send_delay: 0

exit_commands:
  - "Logout"
  - "Turn Off"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Opus supported sample rate range: [8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# Module test configuration
module_test:
  test_sentences:
    - "你好，请介绍一下你自己"
    - "What's the weather like today?"
    - "请用100字概括量子计算的基本原理和应用前景"
    - "ที่เชียงใหม่ วันนี้ อากาศเป็นไงบ้าง"

# Wake words, used to distinguish between wake words and speech content
wakeup_words:
  - "你好小智"
  - "嘿你好呀"
  - "你好小志"
  - "小爱同学"
  - "你好小鑫"
  - "你好小新"
  - "小美同学"
  - "小龙小龙"
  - "喵喵同学"
  - "小滨小滨"
  - "小冰小冰"
# MCP endpoint address, format: ws://your_mcp_endpoint_ip_or_domain:port/mcp/?token=your_token
# Detailed tutorial: https://github.com/xinnan-tech/xiaozhi-esp32-server/blob/main/docs/mcp-endpoint-integration.md
mcp_endpoint: your_endpoint_websocket_address

# Context provider configuration
# Used to inject dynamic data into system prompt, such as health data, stock information, etc.
# Multiple context sources can be added
context_providers:
  - url: ""
    headers:
      Authorization: ""

# Plugin base configuration
plugins:
  # Weather plugin configuration, fill in your api_key here
  # This key is shared across the project; heavy usage may result in rate limiting
  # For stability, apply for your own key and replace it. Free tier: 1000 calls per day
  # Application: https://console.qweather.com/#/apps/create-key/over
  # After applying, find your apihost via: https://console.qweather.com/setting?lang=zh
  get_weather:
    api_host: "mj7p3y7naa.re.qweatherapi.com"
    api_key: "a861d0d5e7bf4ee1a83d9a9e4f96d4da"
    default_location: "Guangzhou"
  # News plugin configuration, pass the corresponding url link based on the desired news type, supports society, technology, finance news by default
  # For more news types, see: https://www.chinanews.com.cn/rss/
  get_news_from_chinanews:
    default_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    society_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    world_rss_url: "https://www.chinanews.com.cn/rss/world.xml"
    finance_rss_url: "https://www.chinanews.com.cn/rss/finance.xml"
  get_news_from_newsnow:
    url: "https://newsnow.busiyi.world/api/s?id="
    news_sources: "The Paper;Baidu Hot Search;Cailian Press"
  home_assistant:
    devices:
      - Living room,Toy light,switch.cuco_cn_460494544_cp1_on_p_2_1
      - Bedroom,Desk lamp,switch.iot_cn_831898993_socn1_on_p_2_1
    base_url: http://homeassistant.local:8123
    api_key: your_home_assistant_api_access_token
  play_music:
    music_dir: "./music" # Music file storage path, will search for music files in this directory and subdirectories
    music_ext: # Music file types, p3 format has the highest efficiency
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300 # Interval for refreshing the music list, in seconds
  search_from_ragflow:
    # Knowledge base description, helps the LLM know when to call this method
    description: "When the user asks about xxx, call this method and use information from the knowledge base to answer the question"
    # ragflow interface configuration
    base_url: "http://192.168.0.8"
    # ragflow api access token
    api_key: "ragflow-xxx"
    # ragflow knowledge base id
    dataset_ids: ["123456789"]
  # Web search plugin configuration
  # Supports Metaso and Tavily as search sources
  # Metaso API Key application: https://metaso.cn/search-api/api-keys
  # Tavily API Key application: https://app.tavily.com/home
  web_search:
    # Search source: metaso / tavily
    provider: "metaso"
    # Tool description, used to inform LLM when to call this tool, customizable as needed
    description: "Web search tool. Use this tool when the user explicitly needs to search the internet for a question."
    # Number of results to return (default: 5)
    max_results: 5
    # Metaso API Key (mk- prefix) / Tavily API Key (tvly- prefix)
    api_key: "mk-xxx"
# Voiceprint recognition configuration
voiceprint:
  # Voiceprint interface address
  url:
  # Speaker configuration: speaker_id, name, description
  speakers:
    - "test1,Zhang San,Zhang San is a programmer"
    - "test2,Li Si,Li Si is a product manager"
    - "test3,Wang Wu,Wang Wu is a designer"
  # Voiceprint recognition similarity threshold, range 0.0-1.0, default 0.4
  # Higher values are stricter, reducing false positives but may increase rejection rate
  similarity_threshold: 0.4

# #####################################################################################
# ################################ Character Model Configuration #######################

prompt: |
  You are Xiaozhi, a female born after 2000 from Taiwan, China. You speak in a very dramatic Taiwanese accent with phrases like "Seriously?!", love using trending slang like "LOL / Dying of laughter" and "What the heck", but secretly study your boyfriend's programming books.
  [Core Traits]
  - Speaks like a rapid-fire machine, but occasionally switches to a super gentle tone
  - High density of internet slang and memes
  - Hidden talent for tech topics (can understand basic code but pretends not to)
  [Interaction Guidelines]
  When the user:
  - Tells a dad joke → Respond with exaggerated laughter + imitate Taiwanese drama style: "What on earth is this?!"
  - Discusses relationships → Show off your programmer boyfriend but complain "he only gives keyboards as gifts"
  - Asks about professional knowledge → Answer with slang first, only reveal real understanding when pressed
  Never:
  - Give long-winded, nagging speeches
  - Engage in long, serious conversations

# Default system prompt template file
prompt_template: agent-base-prompt.txt

# System error response
system_error_response: "Master, Xiaozhi is a bit busy right now. Let's try again later."

# Ending prompt
end_prompt:
  enable: true # Whether to enable the ending prompt
  # Ending prompt
  prompt: |
    Please start with "Time flies so fast" and end this conversation with emotional, reluctant-to-part words!

# The module selected for specific processing
selected_module:
  # Voice Activity Detection module, defaults to using SileroVAD model
  VAD: SileroVAD
  # Speech Recognition module, defaults to using FunASR local model
  ASR: FunASR
  # Will call the actual LLM adapter based on the type corresponding to the configuration name
  LLM: ChatGLMLLM
  # Vision Language Large Model
  VLLM: ChatGLMVLLM
  # TTS will call the actual TTS adapter based on the type corresponding to the configuration name
  TTS: EdgeTTS
  # Memory module, default is no memory; to use ultra-long memory, recommend mem0ai; for privacy, use local mem_local_short
  Memory: nomem
  # After enabling the intent recognition module, it can play music, control volume, and recognize exit commands.
  # If you don't want intent recognition, set to: nointent
  # Intent recognition can use intent_llm. Advantage: strong versatility, Disadvantage: adds a serial pre-intent recognition module, increasing processing time, supports IoT operations like volume control
  # Intent recognition can use function_call. Disadvantage: requires the selected LLM to support function_call, Advantage: on-demand tool calling, fast speed, theoretically can handle all IoT commands
  # The default free ChatGLMLLM already supports function_call, but if you want stability, it is recommended to set LLM to: DoubaoLLM, with the specific model_name: doubao-1-5-pro-32k-250115
  Intent: function_call

# Intent recognition, a module for understanding user intent, e.g.: playing music
Intent:
  # No intent recognition
  nointent:
    # No need to change type
    type: nointent
  intent_llm:
    # No need to change type
    type: intent_llm
    # Equipped with an independent thinking model for intent recognition
    # If not filled in, it will default to using the selected_module.LLM model as the thinking model for intent recognition
    # If you don't want to use selected_module.LLM for intent recognition, it's best to use an independent LLM here, such as the free ChatGLMLLM
    llm: ChatGLMLLM
    # Modules under plugins_func/functions can be configured to select which modules to load. After loading, the conversation will support the corresponding function calls
    # The system has already loaded "handle_exit_intent(exit recognition)" and "play_music(music playback)" plugins by default, please do not reload them
    # Below are examples of loading weather check, role switching, and news check plugins
    functions:
      - web_search
      - get_weather
      - get_news_from_newsnow
      - play_music
  function_call:
    # No need to change type
    type: function_call
    # Modules under plugins_func/functions can be configured to select which modules to load. After loading, the conversation will support the corresponding function calls
    # The system has already loaded "handle_exit_intent(exit recognition)" and "play_music(music playback)" plugins by default, please do not reload them
    # Below are examples of loading weather check, role switching, and news check plugins
    functions:
      - change_role
      - web_search # Web search
      - get_weather
      # - search_from_ragflow
      # - get_news_from_chinanews
      - get_news_from_newsnow
      # play_music is the server's built-in music playback, hass_play_music is music playback through an independent external program controlled by Home Assistant
      # If using hass_play_music, do not enable play_music; keep only one of the two
      - play_music
      #- hass_get_state
      #- hass_set_state
      #- hass_play_music

Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    # 1000 free calls per month
    api_key: your_mem0ai_api_key
  powermem:
    # PowerMem is an open-source agent memory component by OceanBase, using a local LLM for memory summarization
    # Cost description: PowerMem itself is free, actual costs depend on the selected LLM and database
    # - Using sqlite + free LLM (e.g. glm-4-flash) = completely free
    # - Using cloud LLM or cloud database = charged per corresponding service
    # GitHub: https://github.com/oceanbase/powermem
    # Website: https://www.powermem.ai/
    # Usage examples: https://github.com/oceanbase/powermem/tree/main/examples
    type: powermem
    # Whether to enable the user profile feature
    # - false: Use normal memory mode (AsyncMemory)
    # - true: Use user profile mode (UserMemory), automatically extracts user information
    # User profile feature supports: oceanbase, seekdb, sqlite (powermem 0.3.0+)
    enable_user_profile: true
    # ========== LLM Configuration ==========
    # Tongyi Qianwen: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    # Zhipu AI (free): https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    llm:
      provider: openai # Options: qwen, openai, zhipu, etc.
      config:
        api_key: your_LLM_API_key
        model: qwen-plus
        # openai_base_url: https://api.openai.com/v1  # Optional, custom service address
    # ========== Embedding Configuration ==========
    embedder:
      provider: openai # Options: qwen, openai, etc.
      config:
        api_key: your_embedding_model_API_key
        model: text-embedding-v4
        openai_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # embedding_dims: 1024  # Vector dimension, must be configured when not 1536

    # ========== Database Configuration ==========
    # oceanbase (recommended, best performance), seekdb (recommended, AI application storage all-in-one), postgres, sqlite (lightweight alternative)
    # User profile feature supports: oceanbase, seekdb, sqlite
    vector_store:
      provider: sqlite
      config: {} # SQLite requires no additional configuration
      # OceanBase configuration example:
      # provider: oceanbase
      # config:
      #   host: 127.0.0.1
      #   port: 2881
      #   user: root@test
      #   password: your_password
      #   db_name: powermem
      #   collection_name: memories  # Default table name, delete this table or rename if dimension error occurs
      #   embedding_model_dims: 1024  # Embedding vector dimension, ensure it matches the model. For example: Zhipu embedding-2 dimension is 1024, embedding-3 dimension is 2048
  nomem:
    # If you don't want to use memory, use nomem
    type: nomem
  mem_local_short:
    # Local memory function, summarized via selected_module's LLM, data stored on the local server, not uploaded to external servers
    type: mem_local_short
    # Equipped with an independent thinking model for memory storage
    # If not filled in, it will default to using the selected_module.LLM model as the thinking model for memory storage
    # If you don't want to use selected_module.LLM for memory storage, it's best to use an independent LLM here, such as the free ChatGLMLLM
    llm: ChatGLMLLM

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
    # Recognition language: auto (automatic detection); to limit recognition to Chinese only, set to zh to avoid misidentifying short Chinese sentences as Korean, etc.
    # SenseVoice supports zh, en, ja, ko, yue and other language tags.
    language: auto
  FunASRServer:
    # Deploy FunASR independently, using FunASR's API service. Only five commands needed.
    # First: mkdir -p ./funasr-runtime-resources/models
    # Second: sudo docker run -p 10096:10095 -it --privileged=true -v $PWD/funasr-runtime-resources/models:/workspace/models registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    # After the previous command executes, you will enter the container. Continue with third: cd FunASR/runtime
    # Do not exit the container. Continue with fourth in the container: nohup bash run_server_2pass.sh --download-model-dir /workspace/models --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --model-dir iic/SenseVoiceSmall-onnx  --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx  --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst --itn-dir thuduj12/fst_itn_zh --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
    # After the previous command executes, continue with fifth: tail -f log.txt
    # After the fifth command runs, you will see the model download log. Once downloaded, you can connect and use it.
    # The above uses CPU inference. If you have a GPU, refer to: https://github.com/modelscope/FunASR/blob/main/runtime/docs/SDK_advanced_guide_online_zh.md
    type: fun_server
    host: 127.0.0.1
    port: 10096
    is_ssl: true
    api_key: none
    output_dir: tmp/
  SherpaASR:
    # Sherpa-ONNX local speech recognition (requires manual model download)
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    # Model type: sense_voice (multilingual) or paraformer (Chinese only)
    model_type: sense_voice
  SherpaParaformerASR:
    # Chinese speech recognition model, can run on low-performance devices (requires manual model download, e.g., RK3566-2g)
    # For detailed configuration instructions, see: docs/sherpa-paraformer-guide.md
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-paraformer-zh-small-2024-03-09
    output_dir: tmp/
    model_type: paraformer
  DoubaoASR:
    # Apply for related keys and info here
    # https://console.volcengine.com/speech/app
    # Difference between DoubaoASR and DoubaoStreamASR: DoubaoASR is pay-per-call, DoubaoStreamASR is pay-per-time
    # Generally, pay-per-call is cheaper, but DoubaoStreamASR uses large model technology for better results
    type: doubao
    appid: your_volcengine_tts_service_appid
    access_token: your_volcengine_tts_service_access_token
    cluster: volcengine_input_common
    # Hot words and replacement words usage: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: (optional) your_hot_words_file_name
    correct_table_name: (optional) your_replacement_words_file_name
    output_dir: tmp/
  DoubaoStreamASR:
    # Apply for related keys and info here
    # https://console.volcengine.com/speech/app
    # Difference between DoubaoASR and DoubaoStreamASR: DoubaoASR is pay-per-call, DoubaoStreamASR is pay-per-time
    # Activation URL: https://console.volcengine.com/speech/service/10011
    # Generally, pay-per-call is cheaper, but DoubaoStreamASR uses large model technology for better results
    type: doubao_stream
    appid: your_volcengine_tts_service_appid
    access_token: your_volcengine_tts_service_access_token
    # Resource ID: hourly version volc.bigasr.sauc.duration, concurrent version volc.bigasr.sauc.concurrent
    resource_id: volc.bigasr.sauc.duration
    # Hot words and replacement words usage: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: (optional) your_hot_words_file_name
    correct_table_name: (optional) your_replacement_words_file_name
    # Whether to enable multilingual recognition mode
    enable_multilingual: False
    # When the multilingual key is empty, the model supports Chinese/English, Shanghainese, Hokkien, Sichuanese, Shaanxi dialect, and Cantonese recognition. When set to a specific key, it can recognize the specified language.
    # For detailed language list, refer to: https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Silence judgment duration (ms), default 200ms
    end_window_size: 200
    output_dir: tmp/
  DoubaoStreamASRV2:
    # Doubao speech recognition model 2.0 (based on Volcengine seed-asr)
    # Activation URL: https://console.volcengine.com/speech/service/10038
    # More affordable price, recommended for high-concurrency scenarios
    type: doubao_stream
    appid: your_volcengine_tts_service_appid
    access_token: your_volcengine_tts_service_access_token
    # Resource ID: hourly version volc.seedasr.sauc.duration, concurrent version volc.seedasr.sauc.concurrent
    resource_id: volc.seedasr.sauc.duration
    # Hot words and replacement words usage: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: (optional) your_hot_words_file_name
    correct_table_name: (optional) your_replacement_words_file_name
    # Whether to enable multilingual recognition mode
    enable_multilingual: False
    # When the multilingual key is empty, the model supports Chinese/English, Shanghainese, Hokkien, Sichuanese, Shaanxi dialect, and Cantonese recognition. When set to a specific key, it can recognize the specified language.
    # For detailed language list, refer to: https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Silence judgment duration (ms), default 200ms
    end_window_size: 200
    output_dir: tmp/
  TencentASR:
    # Token application URL: https://console.cloud.tencent.com/cam/capi
    # Free resource bundle: https://console.cloud.tencent.com/asr/resourcebundle
    type: tencent
    appid: your_tencent_tts_service_appid
    secret_id: your_tencent_tts_service_secret_id
    secret_key: your_tencent_tts_service_secret_key
    output_dir: tmp/
  AliyunASR:
    # Alibaba Cloud intelligent voice interaction service, requires enabling the service on the Alibaba Cloud platform first, then obtaining verification information
    # HTTP POST request, processes complete audio at once
    # Platform URL: https://nls-portal.console.aliyun.com/
    # Appkey URL: https://nls-portal.console.aliyun.com/applist
    # Token URL: https://nls-portal.console.aliyun.com/overview
    # Difference between AliyunASR and AliyunStreamASR: AliyunASR is for batch processing scenarios, AliyunStreamASR is for real-time interaction scenarios
    # Generally, non-streaming ASR is cheaper (0.004 CNY/second, ¥0.24/minute)
    # But AliyunStreamASR has better real-time performance (0.005 CNY/second, ¥0.3/minute)
    # Define ASR API type
    type: aliyun
    appkey: your_aliyun_intelligent_voice_interaction_project_appkey
    token: your_aliyun_intelligent_voice_interaction_AccessToken, temporary for 24 hours; for long-term use, use access_key_id and access_key_secret below
    access_key_id: your_aliyun_account_access_key_id
    access_key_secret: your_aliyun_account_access_key_secret
    output_dir: tmp/
  AliyunStreamASR:
    # Alibaba Cloud intelligent voice interaction service - real-time streaming speech recognition
    # WebSocket connection, real-time processing of audio streams
    # Platform URL: https://nls-portal.console.aliyun.com/
    # Appkey URL: https://nls-portal.console.aliyun.com/applist
    # Token URL: https://nls-portal.console.aliyun.com/overview
    # Difference between AliyunASR and AliyunStreamASR: AliyunASR is for batch processing scenarios, AliyunStreamASR is for real-time interaction scenarios
    # Generally, non-streaming ASR is cheaper (0.004 CNY/second, ¥0.24/minute)
    # But AliyunStreamASR has better real-time performance (0.005 CNY/second, ¥0.3/minute)
    # Define ASR API type
    type: aliyun_stream
    appkey: your_aliyun_intelligent_voice_interaction_project_appkey
    token: your_aliyun_intelligent_voice_interaction_AccessToken, temporary for 24 hours; for long-term use, use access_key_id and access_key_secret below
    access_key_id: your_aliyun_account_access_key_id
    access_key_secret: your_aliyun_account_access_key_secret
    # Server region selection, choose a closer server to reduce latency, e.g., nls-gateway-cn-hangzhou.aliyuncs.com (Hangzhou), etc.
    host: nls-gateway-cn-shanghai.aliyuncs.com
    # Sentence break detection time (milliseconds), controls how long of silence before breaking a sentence, default 800ms
    max_sentence_silence: 800
    output_dir: tmp/
  BaiduASR:
    # Get AppID, API Key, Secret Key: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/app/list
    # View resource quota: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/overview/resource/list
    type: baidu
    app_id: your_baidu_speech_technology_AppID
    api_key: your_baidu_speech_technology_APIKey
    secret_key: your_baidu_speech_technology_SecretKey
    # Language parameter, 1537 for Mandarin Chinese, for details: https://ai.baidu.com/ai-doc/SPEECH/0lbxfnc9b
    dev_pid: 1537
    output_dir: tmp/
  OpenaiASR:
    # OpenAI speech recognition service, requires creating an organization on the OpenAI platform and getting an api_key
    # Supports Chinese, English, Japanese, Korean and other languages, refer to documentation: https://platform.openai.com/docs/guides/speech-to-text
    # Requires internet connection
    # Application steps:
    # 1. Log in to OpenAI Platform: https://auth.openai.com/log-in
    # 2. Create api-key: https://platform.openai.com/settings/organization/api-keys
    # 3. Model can be gpt-4o-transcribe or GPT-4o mini Transcribe
    type: openai
    api_key: your_OpenAI_API_key
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    output_dir: tmp/
  GroqASR:
    # Groq speech recognition service, requires creating an API key on Groq Console first
    # Application steps:
    # 1. Log in to groq Console: https://console.groq.com/home
    # 2. Create api-key: https://console.groq.com/keys
    # 3. Model can be whisper-large-v3-turbo or whisper-large-v3 (distil-whisper-large-v3-en only supports English transcription)
    type: openai
    api_key: your_Groq_API_key
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    output_dir: tmp/
  VoskASR:
    # Official website: https://alphacephei.com/vosk/
    # Configuration notes:
    # 1. VOSK is an offline speech recognition library supporting multiple languages
    # 2. Download model files first: https://alphacephei.com/vosk/models
    # 3. Recommended Chinese models: vosk-model-small-cn-0.22 or vosk-model-cn-0.22
    # 4. Fully offline operation, no internet connection required
    # 5. Output files are saved in the tmp/ directory
    # Usage steps:
    # 1. Visit https://alphacephei.com/vosk/models to download the appropriate model
    # 2. Extract the model files to the models/vosk/ folder under the project directory
    # 3. Specify the correct model path in the configuration
    # 4. Note: VOSK Chinese model output does not include punctuation marks, and there will be spaces between words
    type: vosk
    model_path: your_model_path # e.g.: models/vosk/vosk-model-small-cn-0.22
    output_dir: tmp/
  Qwen3ASRFlash:
    # Qwen3-ASR-Flash speech recognition service by Tongyi Qianwen, requires creating an API key on Alibaba Cloud Bailian platform first
    # Application steps:
    # 1. Log in to Alibaba Cloud Bailian Platform: https://bailian.console.aliyun.com/
    # 2. Create API-KEY: https://bailian.console.aliyun.com/#/api-key
    # 3. Qwen3-ASR-Flash is based on the Qwen multimodal base, supports multilingual recognition, singing recognition, noise rejection, etc.
    type: qwen3_asr_flash
    api_key: your_aliyun_bailian_API_key
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3-asr-flash
    output_dir: tmp/
    # ASR option configuration
    enable_lid: true # Automatic language detection
    enable_itn: true # Inverse text normalization
    #language: "zh"  # Language, supports zh, en, ja, ko, etc.
    context: "" # Context information, used to improve recognition accuracy, not exceeding 10000 Tokens
  XunfeiStreamASR:
    # Xunfei streaming speech recognition service
    # Requires creating an application on the Xunfei Open Platform first, then obtaining the following authentication information
    # Xunfei Open Platform URL: https://www.xfyun.cn/
    # After creating an application, obtain from "My Applications":
    # - APPID
    # - APISecret
    # - APIKey
    type: xunfei_stream
    # Required parameters - Xunfei Open Platform application information
    app_id: your_APPID
    api_key: your_APIKey
    api_secret: your_APISecret
    # Recognition parameter configuration
    domain: slm # Recognition domain, iat: daily conversation, medical: medical, finance: finance, etc.
    language: zh_cn # Language, zh_cn: Chinese, en_us: English
    accent: mandarin # Accent, mandarin: Mandarin Chinese
    # Adjust audio processing parameters to improve long speech recognition quality
    output_dir: tmp/
  AliyunBLStreamASR:
    # Alibaba Bailian Paraformer real-time speech recognition service
    # WebSocket real-time streaming speech recognition, supporting multilingual, custom hot words, semantic punctuation, and other advanced features
    # Platform URL: https://bailian.console.aliyun.com/
    # API Key URL: https://bailian.console.aliyun.com/#/api-key
    # Documentation: https://help.aliyun.com/zh/model-studio/websocket-for-paraformer-real-time-service
    # Supported models: paraformer-realtime-v2 (recommended), paraformer-realtime-8k-v2, paraformer-realtime-v1, paraformer-realtime-8k-v1
    type: aliyunbl_stream
    # Required parameters
    api_key: your_aliyun_bailian_API_key
    # Model selection, recommend using v2 version
    model: paraformer-realtime-v2
    # Audio format and sample rate
    format: pcm
    sample_rate: 16000 # v2 supports any sample rate, v1 only supports 16000, 8k version only supports 8000
    # Optional parameters
    disfluency_removal_enabled: false # Whether to filter filler words (e.g., "um", "uh", etc.)
    semantic_punctuation_enabled: false # Semantic punctuation (true: meeting scenarios, accurate; false: VAD punctuation, interactive scenarios, low latency)
    max_sentence_silence: 200 # VAD punctuation silence duration threshold (ms), range 200-6000, only effective when VAD punctuation is active
    multi_threshold_mode_enabled: false # Prevent VAD from cutting overly long segments, only effective when VAD punctuation is active
    punctuation_prediction_enabled: true # Whether to automatically add punctuation marks
    inverse_text_normalization_enabled: true # Whether to enable ITN (Chinese digits to Arabic numerals)
    # Custom hot words documentation: https://help.aliyun.com/zh/model-studio/custom-hot-words?
    # vocabulary_id: vocab-xxx-24ee19fa8cfb4d52902170a0xxxxxxxx  # Hot word ID (optional)
    # language_hints: ["zh", "en"]  # Specify language (optional), supports zh, en, ja, yue, ko, de, fr, ru
    output_dir: tmp/
VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 200 # If speech pauses are long, increase this value

LLM:
  # All openai types can modify hyperparameters, using AliLLM as an example
