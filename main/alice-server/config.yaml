    voice: BV001_streaming
    output_dir: tmp/
    authorization: "Bearer;"
    appid: your_volcengine_tts_service_appid
    access_token: your_volcengine_tts_service_access_token
    cluster: volcano_tts
    speed_ratio: 1.0
    volume_ratio: 1.0
    pitch_ratio: 1.0
    # language: "Chinese"  # Specify output language, e.g.: Chinese, English, Japanese, Korean, etc. Set according to the selected voice's supported languages; defaults to Chinese if not set
  #Volcengine TTS, supports bidirectional streaming TTS
  HuoshanDoubleStreamTTS:
    type: huoshan_double_stream
    # Visit https://console.volcengine.com/speech/service/10007 to activate the large model TTS, purchase voices
    # Get appid and access_token at the bottom of the page
    # Resource ID is fixed as: volc.service_type.10029 (large model TTS and mixing)
    # If using Gizwits, change the interface address to wss://bytedance.gizwitsapi.com/api/v3/tts/bidirection
    # Gizwits does not require appid
    ws_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    appid: your_volcengine_tts_service_appid
